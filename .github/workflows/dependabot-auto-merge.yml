name: Dependabot auto-merge

# This privileged workflow only reads metadata; never check out or run PR code.
on:
    pull_request_target:
        types: [opened, reopened, synchronize, ready_for_review]
        branches: [main]

permissions:
    contents: write
    pull-requests: write

jobs:
    enable-auto-merge:
        if: >-
            github.event.pull_request.user.login == 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Read Dependabot update metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Queue compatible updates after required checks
              if: >-
                  steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
                  steps.metadata.outputs.update-type == 'version-update:semver-minor'
              run: gh pr merge --auto --squash --match-head-commit "$PR_HEAD" "$PR_URL"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
