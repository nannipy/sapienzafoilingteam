name: Security Audit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 0 * * 1" # Run every Monday at midnight

permissions: read-all

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            # Dependabot does not provide security updates for the bun ecosystem
            # (only version updates), so `bun audit` is what actually guards this
            # repository against known advisories. Keep this step meaningful.
            #
            # GHSA-mh99-v99m-4gvg (brace-expansion): dev-only, reachable solely via
            # eslint/jest -> minimatch@3/@9, which require brace-expansion ^1/^2.
            # The only patched release is 5.0.8, whose CJS entry exports an object
            # ({ expand }) instead of a function, so forcing it breaks both tools.
            # Drop this ignore once eslint/jest ship a minimatch on brace-expansion ^5.
            #
            # GHSA-rgw5-rvv9-x895 (brace-expansion): same tree, newer advisory.
            # The fix needs different versions per branch (2.1.4 for the glob/
            # minimatch@9 path, 5.0.9 for the typescript-estree/minimatch@10 path)
            # but bun's "overrides" field doesn't support npm-style nested/per-path
            # overrides, and a flat override can't satisfy both majors at once.
            # Dev-only, unreachable from the shipped app.
            #
            # GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh (js-yaml): dev-only, via
            # @istanbuljs/load-nyc-config (last published 1.1.0, requires js-yaml
            # ^3.13.1 and won't be updated). Forcing js-yaml to the patched 3.15.2+
            # would also downgrade @eslint/eslintrc off its required ^4.3.0, which
            # changed load-function APIs between majors. Dev-only, unreachable from
            # the shipped app.
            - name: Run bun audit
              run: bun audit --audit-level=high --ignore=GHSA-mh99-v99m-4gvg --ignore=GHSA-rgw5-rvv9-x895 --ignore=GHSA-5p4m-2wfm-xmqj --ignore=GHSA-2883-xcg3-v3hh
