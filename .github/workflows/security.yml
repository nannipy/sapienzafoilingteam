name: Security Audit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 0 * * 1" # Run every Monday at midnight

permissions: read-all

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - name: Install dependencies
              run: bun install --frozen-lockfile
            # Dependabot does not provide security updates for the bun ecosystem
            # (only version updates), so `bun audit` is what actually guards this
            # repository against known advisories. Keep this step meaningful.
            #
            # GHSA-mh99-v99m-4gvg (brace-expansion): dev-only, reachable solely via
            # eslint/jest -> minimatch@3/@9, which require brace-expansion ^1/^2.
            # The only patched release is 5.0.8, whose CJS entry exports an object
            # ({ expand }) instead of a function, so forcing it breaks both tools.
            # Drop this ignore once eslint/jest ship a minimatch on brace-expansion ^5.
            - name: Run bun audit
              run: bun audit --audit-level=high --ignore=GHSA-mh99-v99m-4gvg
