name: Security Audit

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 0 * * 1" # Run every Monday at midnight

permissions:
    contents: read

jobs:
    audit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"
            - name: Install dependencies
              run: bun install --frozen-lockfile
            # Dependabot does not provide security updates for the bun ecosystem
            # (only version updates), so `bun audit` is what actually guards this
            # repository against known advisories. Keep this step meaningful.
            # The Bun patch bounds braces parsing/traversal while upstream has no
            # fixed release. Keep the regression check even when the audit passes.
            - name: Verify braces security patch
              run: node --test tests/security/braces-depth.test.cjs
            - name: Run bun audit
              run: bun audit --audit-level=moderate

    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4.4"
            - run: bun install --frozen-lockfile
            - run: bun run test --runInBand --coverage=false
